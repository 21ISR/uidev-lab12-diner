<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Student Portal - Login</title>
</head>
<body>
    <div class="auth-container">
        <header class="auth-header">
            <h1 class="auth-title">Student Login</h1>
            <h2 class="auth-subtitle">Access your student account</h2>
        </header>
        <main class="auth-content">
            <form action="/api/login" method="post" class="auth-form">
                <div class="form-group">
                    <label for="email">Email or Student ID</label>
                    <input type="email" id="email" placeholder="Enter your email or student ID">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>
                <div class="form-options">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                    <a class="forgot-link" href="#">Forgot password?</a>
                </div>                
            </form>
            <button class="auth-button">Log In</button>
            <div class="auth-divider">
                <p>OR</p>
            </div>
            <div class="social-auth">
                    <a href="https://www.google.ru/?hl=ru" class="social-btn"> <img src="google.svg" alt="Google"> </a>
                    <a href="https://www.microsoft.com/ru-ru" class="social-btn"><img src="img/microsoft.svg" alt="Microsoft"> </a>
                    <a href="https://www.apple.com/" class="social-btn"> <img src="img/apple.svg" alt="Apple"> </a>    
            </div>
            <div class="auth-switch">
                <p>Don't have an account?</p>
                <a class="switch-link" href="register.html">Register</a>
            </div>
        </main>
    </div>
</body>
</html>
