<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Student Portal - Register</title>
</head>
<body>
    <div class="auth-container">
        <header class="auth-header">
            <h1 class="auth-title">Student Registration</h1>
            <h2 class="auth-subtitle">Create your student account</h2>
        </header>
        <main class="auth-content">
            <form action="/api/register" method="post" class="auth-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Email Address">
                </div>
                <div class="form-group">
                    <label for="student-id">Student ID</label>
                    <input type="text" id="student-id" placeholder="Enter your student ID">
                </div>
                <div class="form-select">
                    <label>Select Program</label>
                    <select class="program-select">
                        <option disabled selected>Choose your program</option>
                        <option value="cs">Computer Science</option>
                        <option value="eng">Engineering</option>
                        <option value="bus">Business</option>
                        <option value="arts">Arts & Humanities</option>
                        <option value="sci">Science</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Confirm your password">
                </div>
                <div class="form-agreement">
                    <input type="checkbox" id="terms">
                    <label for="terms">I agree to the Terms of Service and Privacy Policy</label>
                </div>               
            </form>
            <button class="auth-button">Create Account</button>
            <div class="auth-switch">
                <p>Already have an account?</p>
                <a class="switch-link" href="index.html">Log in</a>
            </div>
        </main>
    </div>
</body>
</html>
